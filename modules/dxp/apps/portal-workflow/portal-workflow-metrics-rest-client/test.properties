    modified.files.includes[relevant][portal-workflow-metrics-rest-client-java-rule]=\
        **/*.java,\
        **/test/**,\
        **/testIntegration/**

    relevant.rule.names=portal-workflow-metrics-rest-client-java-rule

    test.batch.names[relevant][portal-workflow-metrics-rest-client-java-rule]=\
        modules-integration-mysql57,\
        modules-unit

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-tomcat-mysql*-jdk*][test-portal-hotfix-release]=\
        (portal.acceptance == true) AND \
        (testray.main.component.name ~ "Workflow Metrics")

    #
    # Relevant
    #

    modules.includes.required.test.batch.class.names.includes[modules-integration-mysql57][relevant][portal-workflow-metrics-rest-client-java-rule]=\
        apps/portal-workflow/**/*Test.java,\
        dxp/portal-workflow/**/*Test.java

    modules.includes.required.test.batch.class.names.includes[modules-unit][relevant][portal-workflow-metrics-rest-client-java-rule]=\
        apps/portal-workflow/**/*Test.java,\
        dxp/portal-workflow/**/*Test.java