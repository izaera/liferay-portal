##
## Test Suites
##

    modified.files.includes[relevant][questions-java-rule]=\
        **/*.java,\
        **/test/**,\
        **/testIntegration/**

    relevant.rule.names=questions-java-rule

    test.batch.names[relevant][questions-java-rule]=\
        modules-integration-mysql57,\
        modules-unit

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-tomcat-mysql*-jdk*][test-portal-hotfix-release]=\
        (portal.acceptance == true) AND \
        (testray.main.component.name ~ "Questions")

    #
    # Relevant
    #

    modules.includes.required.test.batch.class.names.includes[modules-integration-mysql57][relevant][questions-java-rule]=\
        apps/message-boards/**/*Test.java,\
        apps/questions/**/*Test.java

    modules.includes.required.test.batch.class.names.includes[modules-unit][relevant][questions-java-rule]=\
        apps/message-boards/**/*Test.java,\
        apps/questions/**/*Test.java

##
## Testray
##

    testray.main.component.name=Questions